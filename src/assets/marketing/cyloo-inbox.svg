<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
  <title id="title">CYLOO shared team inbox</title>
  <desc id="desc">An illustrative customer conversation with a team owner and a scheduled follow-up.</desc>
  <rect width="600" height="720" rx="28" fill="#f1f5f9"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a">
    <text x="44" y="84" font-size="13" font-weight="700" fill="#4338ca">CYLOO / SHARED INBOX</text>
    <text x="44" y="128" font-size="28" font-weight="700">Pick up with the full story.</text>
    <rect x="32" y="179" width="536" height="476" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="220" font-size="18" font-weight="700">Example customer</text>
    <text x="60" y="248" font-size="13" fill="#64748b">Assigned to Sales · WhatsApp</text>
    <path d="M32 270H568" stroke="#e2e8f0"/>
    <rect x="60" y="300" width="354" height="78" rx="14" fill="#f1f5f9"/>
    <text x="80" y="331" font-size="15">Can we review the proposal</text>
    <text x="80" y="356" font-size="15">with our team tomorrow?</text>
    <rect x="158" y="402" width="380" height="78" rx="14" fill="#eef2ff"/>
    <text x="178" y="433" font-size="15">Of course. I will send the details</text>
    <text x="178" y="458" font-size="15">and arrange a time with you.</text>
    <rect x="60" y="515" width="478" height="54" rx="12" fill="#ecfdf5"/>
    <text x="80" y="548" font-size="14" fill="#065f46">Team note: follow-up scheduled for tomorrow</text>
    <text x="60" y="613" font-size="13" fill="#64748b">One conversation. Clear ownership. Shared context.</text>
    <text x="44" y="689" font-size="11" fill="#64748b">Illustrative preview · sample conversation</text>
  </g>
</svg>
