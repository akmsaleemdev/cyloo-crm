<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
  <title id="title">CYLOO conversation workflow</title>
  <desc id="desc">A new conversation is tagged and assigned to a team, followed by a scheduled follow-up.</desc>
  <rect width="600" height="720" rx="28" fill="#eef2ff"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a">
    <text x="48" y="85" font-size="13" font-weight="700" fill="#4338ca">CYLOO / WORKFLOW BUILDER</text>
    <text x="48" y="126" font-size="29" font-weight="700">Give every reply a path.</text>
    <text x="48" y="156" font-size="14" fill="#475569">Build a sequence your team can follow.</text>
    <path d="M300 276V321M300 415V460M300 554V599" stroke="#818cf8" stroke-width="3" fill="none"/>
    <g fill="#fff" stroke="#c7d2fe"><rect x="80" y="198" width="440" height="78" rx="16"/><rect x="80" y="321" width="440" height="94" rx="16"/><rect x="80" y="460" width="440" height="94" rx="16"/></g>
    <g fill="#4338ca" font-size="13" font-weight="700"><text x="104" y="226">TRIGGER</text><text x="104" y="351">ACTION</text><text x="104" y="490">NEXT STEP</text></g>
    <text x="104" y="252" font-size="19" font-weight="600">New customer conversation</text>
    <text x="104" y="382" font-size="19" font-weight="600">Tag intent and assign an owner</text>
    <text x="104" y="521" font-size="19" font-weight="600">Schedule a team follow-up</text>
    <rect x="184" y="599" width="232" height="46" rx="23" fill="#4338ca"/>
    <text x="300" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Review the conversation</text>
    <text x="48" y="686" font-size="11" fill="#64748b">Illustrative workflow · configure actions for your workspace</text>
  </g>
</svg>
